# Mirror unidireccional: este repositorio -> repositorio de otra cuenta.
# Configuracion en el repositorio ORIGINAL:
#   Settings > Secrets and variables > Actions
#   Variable MIRROR_REPO = usuario-secundario/urease-cdft-qsar
#   Secret   MIRROR_TOKEN = token fine-grained de la cuenta secundaria
# El token debe tener alcance SOLO sobre el repositorio de destino,
# con permisos Contents: Read and write y Workflows: Read and write.
# ATENCION: git push --mirror SOBREESCRIBE y borra refs exclusivas del destino.

name: Sincronizar mirror secundario

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espejo-github
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener repositorio principal
        uses: actions/checkout@v4
        with:
          repository: DanielBustosG/urease-cdft-qsar
          fetch-depth: 0
          persist-credentials: false

      - name: Replicar ramas y etiquetas
        shell: bash
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
        run: |
          set -euo pipefail

          echo "Origen: ${GITHUB_REPOSITORY}"
          echo "Destino: ${MIRROR_REPO}"

          if [[ -z "${MIRROR_TOKEN}" || -z "${MIRROR_REPO}" ]]; then
            echo "ERROR: faltan credenciales o destino."
            exit 1
          fi

          if [[ "${MIRROR_REPO}" != "JavierFarias04/urease-cdft-qsar" ]]; then
            echo "ERROR: destino inesperado."
            exit 1
          fi

          export GIT_TERMINAL_PROMPT=0

          mirror_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${MIRROR_TOKEN}" | base64 -w0)"

          git -c "http.https://github.com/.extraheader=${mirror_header}" \
            push --force --prune \
            "https://github.com/${MIRROR_REPO}.git" \
            '+refs/remotes/origin/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          echo "Mirror actualizado."

